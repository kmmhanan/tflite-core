# Publishes tflite_core to pub.dev when a v<version> tag is pushed.
# All steps live in the reusable workflow KMM-ZONE/open-flows (https://kmm.zone), referenced by its major
# version (@v1): compatible updates arrive automatically, and the job summary says when a new major exists.
# To freeze a version temporarily, use an exact tag (for example @v1.2.0) instead of @v1.
#
# What it does, in order: tag == pubspec version -> dart format (lib test) -> flutter analyze lib test
#   -> flutter test -> flutter pub publish --dry-run -> flutter pub publish (GitHub OIDC, no secret).
# Run it by hand (Actions -> Publish to pub.dev -> Run workflow) for a dry run that publishes nothing.
name: Publish to pub.dev
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse the release without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: KMM-ZONE/open-flows/.github/workflows/publish-flutter.yml@v1
    with:
      runner: macos-15
      flutter_channel: stable
      check_format: true
      analyze_paths: lib test
      dry_run: ${{ inputs.dry_run || false }}
