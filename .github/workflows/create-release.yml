# Creates the v<version> tag and the GitHub Release for the version in pubspec.yaml.
# The tag push is what starts publish.yml, so the tag is pushed with RELEASE_TOKEN (a personal access token):
# pushes made with the default GITHUB_TOKEN never start other workflows.
name: Create Release
run-name: Create Release for v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version from pubspec.yaml, without the v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow from the main branch."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Check the package name
        shell: bash
        run: |
          package_name=$(sed -n 's/^name: *//p' pubspec.yaml | tr -d "\"'")
          if [[ "$package_name" != "tflite_core" ]]; then
            echo "Expected package name 'tflite_core', got '$package_name'."
            exit 1
          fi

      # Reads the version from pubspec.yaml and compares it with the latest v* tag (full semver ordering)
      - name: Check version
        id: version
        uses: KMM-ZONE/open-flows/actions/check-version@v1
        with:
          version-file: pubspec.yaml

      - name: The requested version must match pubspec.yaml
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$REQUESTED_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Requested version '$REQUESTED_VERSION' does not match pubspec.yaml version '$PACKAGE_VERSION'."
            exit 1
          fi

      - name: Nothing to release
        if: steps.version.outputs.bumped != 'true'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          LATEST_VERSION: ${{ steps.version.outputs.latest-version }}
          REASON: ${{ steps.version.outputs.reason }}
        run: |
          echo "Skipping release: '$PACKAGE_VERSION' is not newer than the latest release '${LATEST_VERSION:-none}' ($REASON)."

      - name: Create and push version tag
        if: steps.version.outputs.bumped == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        if: steps.version.outputs.bumped == 'true'
        uses: KMM-ZONE/open-flows/actions/github-release@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          version: ${{ steps.version.outputs.version }}
          title: tflite_core ${{ steps.version.outputs.tag }}
          token: ${{ secrets.RELEASE_TOKEN }}
